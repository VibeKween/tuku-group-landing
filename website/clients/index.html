<body>

    <!-- Analytics Event Tracking -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const clientRows = document.querySelectorAll('.client-row');
            clientRows.forEach(function(row) {
                row.addEventListener('click', function() {
                    gtag('event', 'client_row_click', {
                        'event_category': 'navigation',
                        'event_label': row.getAttribute('data-client'),
                        'page_location': window.location.href
                    });
                });
            });

            const footerHomeLink = document.getElementById('footerHomeLink');
            if (footerHomeLink) {
                footerHomeLink.addEventListener('click', function() {
                    gtag('event', 'nav_click', {
                        'event_category': 'navigation',
                        'event_label': 'clients_to_home',
                        'page_location': window.location.href
                    });
                });
            }
        });
    </script>
