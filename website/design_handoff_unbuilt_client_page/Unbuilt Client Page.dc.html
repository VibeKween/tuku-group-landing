<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="./avatar-gen.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; }
    a { color: #000; text-decoration: none; }
    a:hover { opacity: 0.55; }
    @keyframes blinkCursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes shakeNo {
      0% { transform: rotate(0deg) translateX(0); }
      4% { transform: rotate(-3.2deg) translateX(-5px); }
      8% { transform: rotate(3deg) translateX(5px); }
      12% { transform: rotate(-2.6deg) translateX(-4px); }
      16% { transform: rotate(2.2deg) translateX(3px); }
      20% { transform: rotate(-1.2deg) translateX(-1px); }
      24%, 100% { transform: rotate(0deg) translateX(0); }
    }
    .pair { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr); align-items: center; gap: clamp(36px, 5vw, 72px); width: 100%; max-width: 940px; }
    .copy { display: flex; flex-direction: column; gap: clamp(14px, 2vw, 20px); }
    .art { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.2vw, 20px); width: 100%; max-width: min(340px, 46vh); justify-self: center; }
    @media (max-width: 780px) {
      .pair { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: clamp(32px, 8vw, 48px); max-width: 420px; }
      .copy { align-items: center; text-align: center; }
      .art { max-width: min(320px, 76vw); }
    }
  </style>
</helmet>

<div style="min-height: 100vh; min-height: 100dvh; width: 100%; background: #fff; color: #000; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(28px, 5vh, 64px); padding: clamp(28px, 5vh, 64px) clamp(24px, 6vw, 64px); text-wrap: pretty;">

  <div class="pair">
    <div class="copy">
      <p style="margin: 0; font-size: clamp(1.5rem, 3.6vw, 2rem); font-weight: 300; letter-spacing: -0.035em; line-height: 1.2; white-space: nowrap;">You weren't supposed<br>to find this page.</p>
      <p style="margin: 0; font-size: clamp(0.875rem, 2.2vw, 0.9375rem); line-height: 1.75; opacity: 0.6; position: relative;">
        <span style="visibility: hidden;">Something is happening back there, but it's not for you.</span>
        <span style="position: absolute; left: 0; top: 0; width: 100%;">{{typed1}}<sc-if value="{{cursor1}}" hint-placeholder-val="{{true}}"><span style="display: inline-block; width: 1px; height: 1.05em; background: #000; vertical-align: -0.16em; margin-left: 0.12em; animation: blinkCursor 1s steps(1) infinite;"></span></sc-if></span>
      </p>
      <p style="margin: 0; font-size: clamp(0.875rem, 2.2vw, 0.9375rem); line-height: 1.75; opacity: 0.6; position: relative;">
        <span style="visibility: hidden;">Here is an animal instead.</span>
        <span style="position: absolute; left: 0; top: 0; width: 100%;">{{typed2}}<sc-if value="{{cursor2}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; width: 1px; height: 1.05em; background: #000; vertical-align: -0.16em; margin-left: 0.12em; animation: blinkCursor 1s steps(1) infinite;"></span></sc-if></span>
      </p>
    </div>

    <div class="art">
      <div onClick="{{reroll}}" style="width: 100%; aspect-ratio: 1; cursor: pointer; line-height: 0; transform-origin: 50% 88%; {{shakeStyle}}">{{avatar}}</div>
      <div style="display: flex; align-items: center; gap: 18px; font-size: 0.8125rem;">
        <span onClick="{{reroll}}" role="button" tabIndex="{{0}}" style="cursor: pointer; min-height: 44px; display: flex; align-items: center; padding: 0 2px;" style-hover="opacity: 0.45;">try again</span>
        <span style="opacity: 0.25;">/</span>
        <span onClick="{{save}}" role="button" tabIndex="{{0}}" style="cursor: pointer; opacity: 0.55; min-height: 44px; display: flex; align-items: center; padding: 0 2px;" style-hover="opacity: 1;">adopt</span>
      </div>
    </div>
  </div>

  <p style="margin: 0; font-size: 0.6875rem; opacity: 0.35; text-align: center;">© 2026 Tuku Group, LLC.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  static L1 = "Something is happening back there, but it's not for you.";
  static L2 = 'Here is an animal instead.';
  state = { seed: Math.floor(Math.random() * 1e9), ti: 0 };
  static LEAD = 26;
  static PAUSE = 78;
  componentDidMount() {
    const total = Component.LEAD + Component.L1.length + Component.PAUSE + Component.L2.length;
    this.t = setInterval(() => {
      this.setState(s => (s.ti >= total ? (clearInterval(this.t), s) : { ti: s.ti + 1 }));
    }, 34);
  }
  componentWillUnmount() { clearInterval(this.t); }
  reroll = () => this.setState({ seed: Math.floor(Math.random() * 1e9) });
  save = () => {
    const g = window.AvatarGen;
    if (g && g.download) g.download(this.state.seed, 1024);
  };
  renderVals() {
    const g = window.AvatarGen;
    const { ti } = this.state;
    const l1 = Component.L1, l2 = Component.L2;
    const i1 = ti - Component.LEAD;
    const i2 = i1 - l1.length - Component.PAUSE;
    return {
      typed1: i1 > 0 ? l1.slice(0, i1) : '',
      typed2: i2 > 0 ? l2.slice(0, i2) : '',
      cursor1: i1 >= 0 && i1 <= l1.length,
      cursor2: i1 > l1.length && i2 < l2.length,
      shakeStyle: i2 >= l2.length ? 'animation: shakeNo 7s ease-in-out infinite;' : '',
      avatar: React.createElement('div', {
        style: { width: '100%', height: '100%' },
        dangerouslySetInnerHTML: { __html: g ? g.avatar(this.state.seed) : '' }
      }),
      reroll: this.reroll,
      save: this.save
    };
  }
}
</script>
</body>
</html>
