<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar Machine</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #faf9f7; color: #111;
    font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;
    padding: 12px 14px 14px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  }
  header { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; width: 100%; max-width: 1100px; margin: 0 auto 8px; flex: none; }
  h1 { font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; margin: 0; }
  .sub { font-size: 0.75rem; opacity: 0.5; line-height: 1.6; margin: 0; flex: 1 1 260px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; max-width: 1100px; margin: 0 auto 8px; flex: none; }
  button {
    font: inherit; font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase;
    background: transparent; color: #111; border: 1px solid #111; padding: 6px 10px; cursor: pointer;
  }
  button:hover { background: #111; color: #faf9f7; }
  .seed { font-size: 0.6875rem; opacity: 0.45; align-self: center; margin-left: auto; letter-spacing: 0.08em; }
  .grid { width: 100%; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 7px; flex: 1; min-height: 0; }
  .tile { position: relative; border: 1px solid rgba(0,0,0,0.14); background: #fff; cursor: pointer; min-height: 0; overflow: hidden; aspect-ratio: 1; height: 100%; width: auto; justify-self: center; }
  .tile svg { display: block; width: 100%; height: 100%; object-fit: contain; }
  @media (hover: none) { .dl { opacity: 1; } }
  .dl {
    position: absolute; right: 4px; bottom: 4px; padding: 3px 5px; font-size: 0.5625rem; letter-spacing: 0.1em;
    background: #fff; border: 1px solid rgba(0,0,0,0.25); opacity: 0; transition: opacity 0.15s ease;
  }
  .tile:hover .dl { opacity: 1; }
  footer { max-width: 1100px; margin: 8px auto 0; flex: none; font-size: 0.6875rem; opacity: 0.4; line-height: 1.7; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(7, minmax(0, 1fr)); } .dl { opacity: 1; } }
  @media (max-height: 560px) { footer { display: none; } .sub { display: none; } }
  @media (max-width: 640px) { body { padding: 10px 10px 18px; } h1 { font-size: 0.75rem; } .tile { aspect-ratio: 1; height: auto; width: 100%; } .grid { grid-template-rows: none; grid-auto-rows: 1fr; flex: none; } button { padding: 8px 10px; min-height: 40px; } .dl { padding: 6px 8px; font-size: 0.5625rem; } }
</style>
</head>
<body>
<header>
  <h1>Avatar Machine</h1>
  <p class="sub">Twenty animals, none of them real. Tap one to redraw it. Download any card as a profile picture.</p>
</header>
<div class="bar">
  <button id="shuffle">Shuffle</button>
  <button id="reseed">New seed</button>
  <button id="dlAll">Download all</button>
  <span class="seed" id="seedLabel"></span>
</div>
<div class="grid" id="grid"></div>
<footer>Every avatar is drawn from its seed — the same seed always gives the same animal. Nothing is uploaded anywhere.</footer>

<script>
const S = 200; // svg user units
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = r => (min, max) => min + r() * (max - min);
function weighted(r, pairs) {
  const total = pairs.reduce((s, p) => s + p[1], 0);
  let n = r() * total;
  for (const [v, w] of pairs) { if ((n -= w) <= 0) return v; }
  return pairs[pairs.length - 1][0];
}

/* ---- sketch rendering: two jittered passes over the same points ---- */
function toPath(pts, closed, jit, r) {
  const p = pts.map(([x, y]) => [x + (r() - 0.5) * jit, y + (r() - 0.5) * jit]);
  const n = p.length;
  let d = `M ${p[0][0].toFixed(2)} ${p[0][1].toFixed(2)}`;
  const at = i => p[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C ${c1[0].toFixed(2)} ${c1[1].toFixed(2)}, ${c2[0].toFixed(2)} ${c2[1].toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
  }
  if (closed) d += ' Z';
  return d;
}
function sketch(out, pts, o, r) {
  const closed = o.closed !== false, fill = o.fill || 'none', w = o.w || 2.2;
  if (fill !== 'none') out.push(`<path d="${toPath(pts, closed, 0.6, r)}" fill="${fill}" stroke="none"/>`);
  out.push(`<path d="${toPath(pts, closed, 1.5, r)}" fill="none" stroke="#141414" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`);
  out.push(`<path d="${toPath(pts, closed, 3.2, r)}" fill="none" stroke="#141414" stroke-width="${(w * 0.55).toFixed(2)}" stroke-linecap="round" stroke-opacity="0.42"/>`);
}
function blob(cx, cy, rx, ry, wob, r, n) {
  n = n || 22;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const k = 1 + (r() - 0.5) * wob;
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return pts;
}

/* ---- trait pools: each layer rolls independently ---- */
const FUR = ['#FF3D6E', '#FF7A00', '#FFD400', '#8AFF1F', '#00E0A4', '#00C2FF', '#6B4BFF', '#FF5CE1', '#00FFD5', '#C4FF00', '#FF9E80', '#B388FF'];
const EARS = [['round', 3], ['point', 3], ['long', 2], ['floppy', 3], ['tiny', 1.5], ['tuft', 1]];
const SNOUT = [['muzzle', 3], ['disc', 2.5], ['beak', 1.5], ['long', 2], ['none', 1]];
const EYES = [['dot', 3], ['ring', 3], ['sleepy', 2], ['googly', 1.5], ['wink', 1.2]];
const MARK = [['none', 2.5], ['spots', 2], ['stripes', 2], ['patch', 2], ['blaze', 1.5]];
const HORNS = [['none', 5], ['cow', 1.6], ['goat', 1.4], ['antler', 1.1], ['nub', 1.2]];
const EXTRA = [['none', 3.4], ['collar', 1.6], ['bow', 1.2], ['monocle', 1], ['hat', 1.1], ['tongue', 1.2]];

function avatar(seed) {
  const r = mulberry32(seed), rr = R(r), out = [];
  const fi = Math.floor(r() * FUR.length);
  const fur = FUR[fi];
  const dark = FUR[(fi + 3 + Math.floor(r() * 6)) % FUR.length];
  const pop = FUR[(fi + 7 + Math.floor(r() * 4)) % FUR.length];
  const ears = weighted(r, EARS), snout = weighted(r, SNOUT), eyes = weighted(r, EYES);
  const mark = weighted(r, MARK), horns = weighted(r, HORNS), extra = weighted(r, EXTRA);
  const bg = ['#FFFFFF', '#FFF8E1', '#F2FFE0', '#E8F6FF', '#FFEDF6', '#F3ECFF'][Math.floor(r() * 6)];
  const cx = 100, cy = 96;
  const rx = rr(46, 60), ry = rr(44, 62);

  // shoulders
  sketch(out, [[cx - rx * 1.5, 200], [cx - rx * 1.15, 168], [cx, 152], [cx + rx * 1.15, 168], [cx + rx * 1.5, 200]], { fill: dark, w: 2 }, r);

  // ears (behind head)
  const earY = cy - ry * 0.78, earX = rx * 0.72;
  [-1, 1].forEach(s => {
    const bx = cx + s * earX;
    if (ears === 'round') sketch(out, blob(bx, earY - 18, 20, 20, 0.18, r, 14), { fill: fur }, r);
    else if (ears === 'point') sketch(out, [[bx - 17, earY + 8], [bx + s * 4, earY - 42], [bx + 17, earY + 6]], { fill: fur }, r);
    else if (ears === 'long') sketch(out, blob(bx + s * 6, earY - 40, 11, 40, 0.14, r, 16), { fill: fur }, r);
    else if (ears === 'floppy') sketch(out, blob(bx + s * 14, earY + 22, 15, 34, 0.2, r, 16), { fill: fur }, r);
    else if (ears === 'tiny') sketch(out, blob(bx, earY - 6, 11, 10, 0.2, r, 12), { fill: fur }, r);
    else sketch(out, [[bx - 14, earY + 8], [bx - 6, earY - 34], [bx + s * 2, earY - 8], [bx + 8, earY - 38], [bx + 15, earY + 6]], { fill: fur }, r);
  });

  // horns
  if (horns !== 'none') {
    [-1, 1].forEach(s => {
      const bx = cx + s * rx * 0.5, by = cy - ry * 0.92;
      if (horns === 'cow') sketch(out, [[bx, by + 6], [bx + s * 26, by - 10], [bx + s * 36, by + 2]], { closed: false, w: 3.4 }, r);
      else if (horns === 'goat') sketch(out, [[bx, by + 4], [bx + s * 8, by - 30], [bx + s * 22, by - 40]], { closed: false, w: 3.2 }, r);
      else if (horns === 'antler') {
        sketch(out, [[bx, by + 4], [bx + s * 10, by - 26], [bx + s * 8, by - 44]], { closed: false, w: 2.8 }, r);
        sketch(out, [[bx + s * 8, by - 30], [bx + s * 26, by - 34]], { closed: false, w: 2.4 }, r);
      } else sketch(out, blob(bx, by - 4, 7, 9, 0.2, r, 10), { fill: fur }, r);
    });
  }

  // head
  sketch(out, blob(cx, cy, rx, ry, 0.12, r), { fill: fur }, r);

  // markings
  if (mark === 'spots') {
    const n = 3 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++) sketch(out, blob(cx + rr(-rx * 0.75, rx * 0.75), cy + rr(-ry * 0.7, ry * 0.55), rr(6, 14), rr(6, 13), 0.3, r, 12), { fill: dark, w: 1.4 }, r);
  } else if (mark === 'stripes') {
    const n = 3 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      const y = cy - ry * 0.6 + i * (ry * 0.34);
      sketch(out, [[cx - rx * 0.8, y], [cx - rx * 0.2, y + rr(-6, 6)], [cx + rx * 0.35, y + rr(-8, 8)]], { closed: false, w: 3 }, r);
    }
  } else if (mark === 'patch') {
    const s = r() < 0.5 ? -1 : 1;
    sketch(out, blob(cx + s * rx * 0.5, cy - ry * 0.18, rx * 0.42, ry * 0.4, 0.25, r, 14), { fill: dark, w: 1.6 }, r);
  } else if (mark === 'blaze') {
    sketch(out, blob(cx, cy + ry * 0.12, rx * 0.28, ry * 0.72, 0.16, r, 14), { fill: dark, w: 1.6 }, r);
  }

  // snout
  const sy = cy + ry * 0.36;
  if (snout === 'muzzle') {
    sketch(out, blob(cx, sy, rx * 0.46, ry * 0.3, 0.15, r, 16), { fill: pop, w: 1.8 }, r);
    sketch(out, blob(cx, sy - 4, 9, 6, 0.2, r, 10), { fill: '#141414', w: 1.4 }, r);
  } else if (snout === 'disc') {
    sketch(out, blob(cx, sy, rx * 0.34, ry * 0.24, 0.1, r, 16), { fill: pop, w: 2 }, r);
    [-1, 1].forEach(s => sketch(out, blob(cx + s * 8, sy, 3.4, 5, 0.2, r, 8), { fill: '#141414', w: 1 }, r));
  } else if (snout === 'beak') {
    sketch(out, [[cx - 20, sy - 8], [cx, sy + 26], [cx + 20, sy - 8]], { fill: pop, w: 2 }, r);
    sketch(out, [[cx - 18, sy - 2], [cx + 18, sy - 2]], { closed: false, w: 1.6 }, r);
  } else if (snout === 'long') {
    sketch(out, blob(cx, sy + 12, rx * 0.3, ry * 0.42, 0.14, r, 16), { fill: pop, w: 1.8 }, r);
    sketch(out, blob(cx, sy + 30, 8, 6, 0.2, r, 10), { fill: '#141414', w: 1.2 }, r);
  }

  // eyes
  const ey = cy - ry * 0.16, ex = rx * 0.4;
  [-1, 1].forEach((s, i) => {
    const bx = cx + s * ex;
    const shut = eyes === 'wink' && i === 1;
    if (eyes === 'sleepy' || shut) sketch(out, [[bx - 11, ey], [bx, ey + 5], [bx + 11, ey]], { closed: false, w: 2.6 }, r);
    else if (eyes === 'ring') {
      sketch(out, blob(bx, ey, 12, 12, 0.12, r, 14), { fill: '#ffffff', w: 2 }, r);
      sketch(out, blob(bx + rr(-3, 3), ey + rr(-2, 2), 5, 5, 0.2, r, 10), { fill: '#141414', w: 1 }, r);
    } else if (eyes === 'googly') {
      sketch(out, blob(bx, ey, 15, 15, 0.14, r, 14), { fill: '#ffffff', w: 2 }, r);
      sketch(out, blob(bx + rr(-7, 7), ey + rr(-6, 6), 4.5, 4.5, 0.2, r, 10), { fill: '#141414', w: 1 }, r);
    } else sketch(out, blob(bx, ey, 6, 6.5, 0.18, r, 10), { fill: '#141414', w: 1.2 }, r);
  });

  // extras
  if (extra === 'collar') sketch(out, [[cx - rx * 1.0, 160], [cx, 172], [cx + rx * 1.0, 160]], { closed: false, w: 4 }, r);
  else if (extra === 'bow') {
    sketch(out, [[cx - 4, 164], [cx - 30, 152], [cx - 30, 176]], { fill: pop, w: 1.8 }, r);
    sketch(out, [[cx + 4, 164], [cx + 30, 152], [cx + 30, 176]], { fill: pop, w: 1.8 }, r);
  } else if (extra === 'monocle') {
    sketch(out, blob(cx + ex, ey, 20, 20, 0.08, r, 16), { closed: true, w: 2.4 }, r);
    sketch(out, [[cx + ex + 14, ey + 16], [cx + ex + 22, 150]], { closed: false, w: 1.6 }, r);
  } else if (extra === 'hat') {
    sketch(out, [[cx - 44, cy - ry * 0.92], [cx + 44, cy - ry * 0.92]], { closed: false, w: 3 }, r);
    sketch(out, [[cx - 26, cy - ry * 0.94], [cx - 22, cy - ry * 1.42], [cx + 22, cy - ry * 1.42], [cx + 26, cy - ry * 0.94]], { fill: pop, w: 2 }, r);
  } else if (extra === 'tongue') {
    sketch(out, blob(cx + rr(-10, 10), sy + ry * 0.3, 9, 13, 0.2, r, 12), { fill: pop, w: 1.8 }, r);
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" role="img" aria-label="A procedurally drawn animal avatar from tukugroup.com"><title>A lousy animal from tukugroup.com</title><desc>Procedurally drawn animal avatar. Seed ${seed}. Made by Tuku Group, LLC — https://tukugroup.com</desc><rect width="${S}" height="${S}" fill="${bg}"/>${out.join('')}</svg>`;
}

/* ---- grid ---- */
const grid = document.getElementById('grid');
const seedLabel = document.getElementById('seedLabel');
let base = Math.floor(Math.random() * 1e9);
let seeds = [];

function derive() {
  const r = mulberry32(base);
  seeds = Array.from({ length: 20 }, () => Math.floor(r() * 1e9));
}
function render() {
  seedLabel.textContent = 'seed ' + base.toString(36).toUpperCase();
  grid.innerHTML = seeds.map((s, i) =>
    `<div class="tile" data-i="${i}">${avatar(s)}<span class="dl" data-dl="${i}">PNG</span></div>`).join('');
}
const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function textChunk(key, value) {
  const body = new TextEncoder().encode(key + '\u0000' + value);
  const type = new TextEncoder().encode('tEXt');
  const out = new Uint8Array(12 + body.length);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, body.length); out.set(type, 4); out.set(body, 8);
  const crcSrc = new Uint8Array(4 + body.length); crcSrc.set(type, 0); crcSrc.set(body, 4);
  dv.setUint32(8 + body.length, crc32(crcSrc));
  return out;
}
const META = [
  ['Title', 'A lousy animal from tukugroup.com'],
  ['Description', 'A procedurally drawn animal avatar made on a page that was not open yet. tukugroup.com'],
  ['Author', 'Tuku Group, LLC'],
  ['Source', 'https://tukugroup.com'],
  ['Copyright', 'Tuku Group, LLC — tukugroup.com'],
  ['Software', 'Tuku Avatar Machine']
];
function withMeta(buf) {
  const src = new Uint8Array(buf), insertAt = 33;
  const chunks = META.map(([k, v]) => textChunk(k, v));
  const extra = chunks.reduce((s, c) => s + c.length, 0);
  const out = new Uint8Array(src.length + extra);
  out.set(src.subarray(0, insertAt), 0);
  let o = insertAt;
  chunks.forEach(c => { out.set(c, o); o += c.length; });
  out.set(src.subarray(insertAt), o);
  return new Blob([out], { type: 'image/png' });
}
function png(svgText, size, name) {
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' }));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
    c.toBlob(b => b.arrayBuffer().then(ab => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(withMeta(ab));
      a.download = name || 'i-went-to-tukugroup.com-and-all-i-got-was-this-lousy-animal.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }), 'image/png');
  };
  img.src = url;
}
window.AvatarDownload = seed => png(avatar(seed), 1024);
grid.addEventListener('click', e => {
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const i = +dl.dataset.dl;
    window.AvatarDownload(seeds[i]);
    return;
  }
  const tile = e.target.closest('.tile');
  if (!tile) return;
  seeds[+tile.dataset.i] = Math.floor(Math.random() * 1e9);
  render();
});
document.getElementById('shuffle').onclick = () => { base = (base * 16807 + 1) % 2147483647; derive(); render(); };
document.getElementById('reseed').onclick = () => { base = Math.floor(Math.random() * 1e9); derive(); render(); };
document.getElementById('dlAll').onclick = () => seeds.forEach((s, i) =>
  setTimeout(() => window.AvatarDownload(s), i * 400));
derive(); render();
</script>
</body>
</html>
